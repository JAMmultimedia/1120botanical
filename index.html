<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11:20 Botanical | Cuidado Artesanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a5d4e; /* Verde Oliva profundo */
            --secondary: #8ba889; /* Verde Suave */
            --accent: #d4a373; /* Tono Arena/Jabón */
            --bg: #fdfbf7; /* Blanco Hueso */
            --text: #2d3a2f;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            position: relative;
        }

        .logo-placeholder {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--secondary);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .divider {
            width: 60px;
            height: 2px;
            background-color: var(--accent);
            margin: 2rem auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-block;
            padding: 10px 24px;
            border: 1px solid var(--secondary);
            border-radius: 50px;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Decoración sutil */
        .leaf {
            position: absolute;
            z-index: -1;
            opacity: 0.1;
            width: 200px;
        }

        .leaf-1 { top: -100px; right: -50px; transform: rotate(45deg); }
        .leaf-2 { bottom: -100px; left: -50px; transform: rotate(-135deg); }

    </style>
</head>
<body>

    <div class="container">
        <div class="leaf leaf-1">🌿</div>
        <div class="leaf leaf-2">🌿</div>

        <div class="logo-placeholder">11:20</div>
        <div class="tagline">Botanical</div>
        
        <div class="divider"></div>

        <h1>Naturaleza pura en cada detalle.</h1>
        <p>Estamos seleccionando los mejores ingredientes botánicos para crear una experiencia única en cuidado personal y jabones artesanales.</p>
        
        <div class="badge">PRÓXIMAMENTE</div>
    </div>

</body>
</html>
